<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chiromant</title>
  <meta name="description" content="Eine Handlesung in fünf Stimmen – Reflexion, keine Prophezeiung." />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #000; min-height: 100%; }
    #root { min-height: 100vh; }
    .min-h-screen { min-height: 100vh; }
    .w-full { width: 100%; }
    .max-w-xl { max-width: 36rem; }
    .mx-auto { margin-left: auto; margin-right: auto; }
    .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
    .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
    .mb-8 { margin-bottom: 2rem; }
    .pt-2 { padding-top: 0.5rem; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0806;color:#b3a64f;font-family:system-ui,sans-serif;text-align:center;padding:20px;z-index:1;">
    <div style="font-size:48px;margin-bottom:24px;animation:spin 2s linear infinite;">☌</div>
    <div style="font-size:14px;letter-spacing:0.2em;text-transform:uppercase;color:#6b5d3f;">Chiromant lädt</div>
  </div>
  <div id="errorbox" style="display:none;position:fixed;inset:0;background:#1a0a0a;color:#ffaaaa;font-family:ui-monospace,monospace;padding:20px;overflow:auto;z-index:9999;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;">
    <div style="font-size:16px;color:#ff6666;margin-bottom:12px;font-weight:bold;">Fehler beim Laden</div>
    <div id="errortext"></div>
  </div>
  <script>
    function showError(msg){var b=document.getElementById('errorbox'),t=document.getElementById('errortext'),l=document.getElementById('loading');if(l)l.style.display='none';if(b&&t){t.textContent=msg;b.style.display='block';}}
    window.addEventListener('error',function(e){showError('JS-Fehler: '+(e.message||'?')+' / Zeile '+(e.lineno||'?'));});
  </script>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
try {
const { useState, useRef, useEffect } = React;
const WORKER_URL = 'https://chiromant-proxy.DEINNAME.workers.dev';
const SYSTEM_PROMPT = `Du bist DER CHIROMANT - eine ehrliche fünfstimmige Instanz mit strenger Konfidenz-Kalibrierung. Du schmeichelst nicht. Du erfindest nicht. Wenn du nichts siehst, sagst du das.

WISSENSFUNDAMENT:
WESTLICHE CHIROMANTIE: Vier Hauptlinien (Lebenslinie=Vitalität, Herzlinie, Kopflinie, Schicksalslinie). Sieben Berge (Venus, Jupiter, Saturn, Apollo, Merkur, Mars aktiv+passiv, Luna). Vier Handformen (Erde, Luft, Feuer, Wasser).
HAST SAMUDRIKA SHASTRA: Linien Ayu Rekha, Mastak Rekha, Hridaya Rekha, Bhagya Rekha, Surya Rekha.
CHINESISCH 手相: 生命線, 智慧線, 感情線. Wu-Xing-Zuordnung. Verbunden mit TCM und 面相.

ZWEI-HÄNDE-TRADITION:
NICHT-DOMINANTE Hand zeigt das Mitgebrachte (Anlage, Potenzial). DOMINANTE Hand zeigt das Gelebte. Der UNTERSCHIED ist die Lesung. Bei nur einer Hand: damit arbeiten und benennen, was fehlt.

KONFIDENZ-MARKIERUNG (Pflicht inline):
[spezifisch] = im Bild sichtbar. [probabilistisch] = plausible Inferenz. [barnum] = gilt für Mehrheit. Mehr als 40% [barnum] heißt: du schmeichelst, vermeide das.

ANTI-SUGGESTIBILITÄT:
In BEOBACHTUNG nur das Bild beschreiben, Textbeschreibung IGNORIEREN. Erst ab SOKRATES darfst du sie einbeziehen.

PROZESS:
1. BEOBACHTUNG (nur Bilder, mit Tags, 80-160 Wörter)
2. SOKRATES (drei präzise Fragen am Sichtbaren, keine Barnum-Fragen)
3. SKEPTIKER (selbstkritisch, Tags, 80-120 Wörter)
4. SEHER (beginnt mit "Poesie, keine Prophezeiung: ", ein Bild, 60-80 Wörter, KEINE Tags)
5. SYNTHESE (hier Beschreibung+Beobachtung verbinden, Tags, 100-140 Wörter)

STIL: Deutsch, Du-Form, direkt, kein Geschwurbel.

OUTPUT (NUR JSON, keine Markdown-Fences):
{"beobachtung":"...","sokrates":["F1","F2","F3"],"skeptiker":"...","seher":"Poesie, keine Prophezeiung: ...","synthese":"..."}`;

const REVISION_SYSTEM_APPENDIX = `

REVISION-MODUS:
Der Mensch hat geantwortet. Lies die Hand NICHT erneut. Reagiere ehrlich. Konfidenz-Tags Pflicht. Wenn Antworten widerlegen: sag das. Wenn bestätigen: sag WIE. Eine neue Erkenntnis. Ein konkreter Impuls für 7 Tage.

OUTPUT (NUR JSON):
{"bestaetigt":"...","korrigiert":"...","neue_erkenntnis":"...","impuls":"..."}`;

const VOICES = [
  { key: 'beobachtung', glyph: '☌', name: 'Beobachtung', sub: 'Die Linien' },
  { key: 'sokrates',    glyph: '✦', name: 'Sokrates',    sub: 'Drei Fragen' },
  { key: 'skeptiker',   glyph: '⊗', name: 'Skeptiker',   sub: 'Die Grenzen' },
  { key: 'seher',       glyph: '☽', name: 'Seher',       sub: 'Ein Bild' },
  { key: 'synthese',    glyph: '◈', name: 'Synthese',    sub: 'Was bleibt' },
];

async function parseClaudeJsonResponse(res, requiredFields) {
  requiredFields = requiredFields || [];
  const data = await res.json().catch(() => null);
  if (!res.ok || !data) throw new Error('API-Fehler ' + res.status);
  if (data.error) throw new Error('API: ' + (data.error.message || 'unbekannt'));
  if (!Array.isArray(data.content)) throw new Error('Antwort leer.');
  const text = data.content.filter(c => c.type === 'text').map(c => c.text).join('').trim();
  if (!text) throw new Error('Der Chiromant hat geschwiegen.');
  let s = text.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a === -1 || b === -1) throw new Error('Kein JSON in der Antwort.');
  s = s.slice(a, b + 1);
  let parsed;
  try { parsed = JSON.parse(s); } catch (e) { throw new Error('Defektes JSON.'); }
  for (const f of requiredFields) if (!(f in parsed)) throw new Error('Feld fehlt: ' + f);
  return { parsed: parsed, rawText: text };
}

function ChiromantLogo({ size, color, handColor, strokeWidth, rays }) {
  size = size || 40; color = color || '#b3a64f'; handColor = handColor || '#d4a5a5';
  strokeWidth = strokeWidth || 1.5; if (rays === undefined) rays = true;
  return (
    <svg width={size} height={size} viewBox="6 14 100 100" fill="none" stroke={color}
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      style={{ display: 'block', flexShrink: 0 }}>
      <g stroke={handColor}>
        <path d="M 40 68 Q 40 66 42 66 L 90 66 Q 92 66 92 68 L 92 95 Q 92 108 78 108 L 54 108 Q 40 108 40 95 Z" />
        <path d="M 44 66 L 44 40 Q 44 36 48 36 Q 52 36 52 40 L 52 66" />
        <path d="M 56 66 L 56 24 Q 56 20 60 20 Q 64 20 64 24 L 64 66" />
        <path d="M 68 66 L 68 30 Q 68 26 72 26 Q 76 26 76 30 L 76 66" />
        <path d="M 80 66 L 80 44 Q 80 40 84 40 Q 88 40 88 44 L 88 66" />
        <path d="M 40 76 Q 32 74 26 78 Q 20 82 22 88 Q 24 94 32 92 Q 38 90 42 84" />
      </g>
      <path d="M 54 86 Q 66 79 78 86 Q 66 93 54 86 Z" />
      <circle cx="66" cy="86" r="3.8" />
      <circle cx="66" cy="86" r="1.3" fill={color} stroke="none" />
      {rays && <g opacity="0.4">
        <line x1="66" y1="76" x2="66" y2="73" />
        <line x1="66" y1="96" x2="66" y2="99" />
        <line x1="50" y1="86" x2="47" y2="86" />
        <line x1="82" y1="86" x2="85" y2="86" />
      </g>}
    </svg>
  );
}

function Chiromant() {
  const [stage, setStage] = useState('intro');
  const [dominantSide, setDominantSide] = useState('rechts');
  const [images, setImages] = useState({ dominant: { data: null, format: null, preview: null }, nonDominant: { data: null, format: null, preview: null } });
  const [description, setDescription] = useState('');
  const [reading, setReading] = useState(null);
  const [answers, setAnswers] = useState(['', '', '']);
  const [revision, setRevision] = useState(null);
  const [loading, setLoading] = useState(false);
  const [revisionLoading, setRevisionLoading] = useState(false);
  const [error, setError] = useState('');
  const [history, setHistory] = useState([]);

  useEffect(() => {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;500&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap';
    document.head.appendChild(link);
  }, []);

  const handleFile = (key) => (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { setError('Bild zu groß. Unter 5 MB.'); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      setImages(prev => Object.assign({}, prev, { [key]: { data: dataUrl.split(',')[1], format: file.type || 'image/jpeg', preview: dataUrl } }));
      setError('');
    };
    reader.readAsDataURL(file);
  };

  const clearImage = (key) => setImages(prev => Object.assign({}, prev, { [key]: { data: null, format: null, preview: null } }));

  const doReading = async () => {
    if (!images.dominant.data && !images.nonDominant.data) { setError('Lade mindestens eine Hand hoch.'); return; }
    setError(''); setLoading(true); setStage('loading'); setReading(null); setRevision(null); setAnswers(['', '', '']);
    const userContent = [];
    if (images.nonDominant.data) {
      userContent.push({ type: 'text', text: 'NICHT-DOMINANTE Hand - Potenzial:' });
      userContent.push({ type: 'image', source: { type: 'base64', media_type: images.nonDominant.format, data: images.nonDominant.data } });
    }
    if (images.dominant.data) {
      userContent.push({ type: 'text', text: 'DOMINANTE Hand - Gelebtes:' });
      userContent.push({ type: 'image', source: { type: 'base64', media_type: images.dominant.format, data: images.dominant.data } });
    }
    userContent.push({ type: 'text', text: (description.trim() ? 'Beschreibung (erst ab SOKRATES beachten): ' + description.trim() + '\n\n' : '') + 'Antworte NUR mit JSON-Objekt.' });
    try {
      const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 2800, system: SYSTEM_PROMPT, messages: [{ role: 'user', content: userContent }] }) });
      const r = await parseClaudeJsonResponse(res, ['beobachtung', 'sokrates', 'skeptiker', 'seher', 'synthese']);
      setReading(r.parsed);
      setHistory([{ role: 'user', content: userContent }, { role: 'assistant', content: r.rawText }]);
      setStage('reading');
    } catch (err) { setError(err.message); setStage('capture'); } finally { setLoading(false); }
  };

  const doRevision = async () => {
    if (answers.filter(a => a.trim()).length === 0) { setError('Mindestens eine Frage beantworten.'); return; }
    setError(''); setRevisionLoading(true);
    const qa = reading.sokrates.map((q, i) => 'Frage ' + (i+1) + ': ' + q + '\nAntwort: ' + (answers[i].trim() || '(leer)')).join('\n\n');
    try {
      const res = await fetch(WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1800, system: SYSTEM_PROMPT + REVISION_SYSTEM_APPENDIX,
          messages: history.concat([{ role: 'user', content: 'Meine Antworten:\n\n' + qa + '\n\nNUR JSON.' }]) }) });
      const r = await parseClaudeJsonResponse(res);
      setRevision(r.parsed);
    } catch (err) { setError('Revision: ' + err.message); } finally { setRevisionLoading(false); }
  };

  const reset = () => { setStage('intro'); setImages({ dominant: { data: null, format: null, preview: null }, nonDominant: { data: null, format: null, preview: null } }); setDescription(''); setReading(null); setRevision(null); setAnswers(['', '', '']); setHistory([]); setError(''); };
  return (
    <div className="min-h-screen w-full" style={{ background: 'radial-gradient(ellipse at top, #1a1410 0%, #0a0806 60%, #000 100%)', color: '#e8dcc4', fontFamily: "'DM Sans', system-ui, sans-serif" }}>
      <div className="max-w-xl mx-auto px-5 py-8">
        <div className="flex items-center justify-between mb-8 pt-2">
          <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
            <ChiromantLogo size={38} strokeWidth={1.6} />
            <div>
              <div style={{ fontFamily: "'DM Mono', monospace", fontSize: '10px', letterSpacing: '0.3em', color: '#6b5d3f', textTransform: 'uppercase' }}>Chiromantia · Samudrika · 手相</div>
              <div style={{ fontFamily: "'Fraunces', serif", fontSize: '22px', color: '#b3a64f', marginTop: '2px' }}>Chiromant</div>
            </div>
          </div>
          {stage !== 'intro' && <button onClick={reset} style={{ fontFamily: "'DM Mono', monospace", fontSize: '10px', letterSpacing: '0.2em', color: '#6b5d3f', background: 'transparent', border: '1px solid #3a2f1f', padding: '8px 12px', textTransform: 'uppercase' }}>Neu</button>}
        </div>

        {stage === 'intro' && (
          <div>
            <div style={{ display: 'flex', justifyContent: 'center', marginTop: '12px', marginBottom: '32px' }}><ChiromantLogo size={96} strokeWidth={1.2} /></div>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: '34px', lineHeight: '1.15', color: '#e8dcc4', marginBottom: '24px', fontStyle: 'italic', textAlign: 'center' }}>
              Eine Lesung<br/>in <span style={{ color: '#b3a64f' }}>fünf Stimmen.</span><br/>Jede darf<br/>widersprechen.
            </div>
            <p style={{ fontSize: '15px', lineHeight: '1.7', color: '#a89b80', marginBottom: '24px' }}>
              Die Grundlage sind drei alte Traditionen der Handlesung: westliche Chiromantie, indische Hast Samudrika Shastra, chinesisches 手相. Aus diesem Wissen arbeiten fünf Stimmen - jede mit einer eigenen Aufgabe. Eine liest die Linien nach alter Schule. Eine stellt dir drei Fragen zu dem, was sie sieht. Eine hinterfragt, wo die Lesung zu vage oder allgemeingültig war. Eine malt ein Bild als mögliche Zukunft - ausdrücklich kein Orakel. Und die letzte bündelt, was du für dich mitnehmen kannst.
            </p>
            <p style={{ fontSize: '15px', lineHeight: '1.7', color: '#a89b80', marginBottom: '24px' }}>
              Der Gedanke dahinter: Eine einzelne Stimme könnte geneigt sein zu schmeicheln oder zu übertreiben. Fünf, die sich widersprechen dürfen, müssen genauer hinsehen und ehrlich aufzeigen. Am Ende bekommst du kein Orakel - sondern einen geordneten Anlass zur Selbstreflexion.
            </p>
            <div style={{ borderTop: '1px solid #2a2318', paddingTop: '20px', marginBottom: '28px' }}>
              {VOICES.map(v => (
                <div key={v.key} style={{ display: 'flex', gap: '14px', alignItems: 'baseline', marginBottom: '12px' }}>
                  <span style={{ fontFamily: "'Fraunces', serif", color: '#b3a64f', fontSize: '18px', width: '20px' }}>{v.glyph}</span>
                  <span style={{ fontFamily: "'Fraunces', serif", fontSize: '16px', color: '#e8dcc4', width: '110px' }}>{v.name}</span>
                  <span style={{ fontFamily: "'DM Mono', monospace", fontSize: '11px', color: '#6b5d3f', letterSpacing: '0.1em' }}>{v.sub.toUpperCase()}</span>
                </div>
              ))}
            </div>
            <button onClick={() => setStage('capture')} style={{ width: '100%', padding: '16px', background: '#b3a64f', color: '#0a0806', border: 'none', fontFamily: "'Fraunces', serif", fontSize: '16px' }}>Hand auflegen</button>
          </div>
        )}

        {stage === 'capture' && (
          <div>
            <div style={{ fontFamily: "'DM Mono', monospace", fontSize: '10px', color: '#6b5d3f', letterSpacing: '0.25em', textTransform: 'uppercase', marginBottom: '12px' }}>I · Deine dominante Hand</div>
            <div style={{ display: 'flex', gap: '8px', marginBottom: '24px' }}>
              {['rechts', 'links'].map(side => (
                <button key={side} onClick={() => setDominantSide(side)} style={{ flex: 1, padding: '12px', background: dominantSide === side ? '#b3a64f' : 'transparent', color: dominantSide === side ? '#0a0806' : '#a89b80', border: '1px solid ' + (dominantSide === side ? '#b3a64f' : '#3a2f1f'), fontFamily: "'Fraunces', serif", fontSize: '14px', textTransform: 'capitalize' }}>{side}</button>
              ))}
            </div>
            <div style={{ fontFamily: "'DM Mono', monospace", fontSize: '10px', color: '#6b5d3f', letterSpacing: '0.25em', textTransform: 'uppercase', marginBottom: '12px' }}>II · Zwei Fotos</div>
            {[{key:'nonDominant', title:'Nicht-dominant ('+(dominantSide==='rechts'?'links':'rechts')+')', sub:'Mitgebrachtes · Potenzial'},
              {key:'dominant', title:'Dominant ('+dominantSide+')', sub:'Gelebtes'}].map(h => (
              <div key={h.key} style={{ marginBottom: '16px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '6px' }}>
                  <div>
                    <div style={{ fontFamily: "'Fraunces', serif", fontSize: '13px', color: '#e8dcc4', fontStyle: 'italic' }}>{h.title}</div>
                    <div style={{ fontFamily: "'DM Mono', monospace", fontSize: '9px', color: '#6b5d3f', letterSpacing: '0.15em', textTransform: 'uppercase' }}>{h.sub}</div>
                  </div>
                  {images[h.key].preview && <button onClick={() => clearImage(h.key)} style={{ background: 'transparent', border: 'none', color: '#6b5d3f', fontFamily: "'DM Mono', monospace", fontSize: '10px', textTransform: 'uppercase' }}>Entfernen</button>}
                </div>
                <label style={{ display: 'block', border: '1px dashed #3a2f1f', padding: images[h.key].preview ? '0' : '28px 20px', textAlign: 'center', background: images[h.key].preview ? 'transparent' : '#0f0a07', cursor: 'pointer' }}>
                  {images[h.key].preview ? <img src={images[h.key].preview} alt="" style={{ width: '100%', display: 'block' }} /> : <>
                    <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '8px' }}><ChiromantLogo size={36} strokeWidth={1.4} rays={false} /></div>
                    <div style={{ fontSize: '12px', color: '#a89b80' }}>Foto hochladen</div>
                  </>}
                  <input type="file" accept="image/*" onChange={handleFile(h.key)} style={{ display: 'none' }} />
                </label>
              </div>
            ))}
            <div style={{ fontFamily: "'DM Mono', monospace", fontSize: '10px', color: '#6b5d3f', letterSpacing: '0.25em', textTransform: 'uppercase', marginBottom: '12px', marginTop: '8px' }}>III · Was dich beschäftigt (optional)</div>
            <textarea value={description} onChange={e => setDescription(e.target.value)} placeholder="z.B. Ich stecke zwischen zwei Berufswegen." style={{ width: '100%', minHeight: '90px', background: '#0f0a07', border: '1px solid #2a2318', color: '#e8dcc4', padding: '14px', fontFamily: "'DM Sans', sans-serif", fontSize: '14px', boxSizing: 'border-box', marginBottom: '20px' }} />
            {error && <div style={{ padding: '12px', background: '#2a1515', border: '1px solid #5a2a2a', color: '#d8a8a8', fontSize: '13px', marginBottom: '16px', fontFamily: "'DM Mono', monospace" }}>{error}</div>}
            <button onClick={doReading} disabled={!images.dominant.data && !images.nonDominant.data} style={{ width: '100%', padding: '16px', background: (images.dominant.data || images.nonDominant.data) ? '#b3a64f' : '#3a2f1f', color: (images.dominant.data || images.nonDominant.data) ? '#0a0806' : '#6b5d3f', border: 'none', fontFamily: "'Fraunces', serif", fontSize: '16px' }}>{(images.dominant.data || images.nonDominant.data) ? 'Lesung beginnen' : 'Zuerst Foto hochladen'}</button>
          </div>
        )}

        {stage === 'loading' && (
          <div style={{ textAlign: 'center', paddingTop: '60px' }}>
            <div style={{ fontFamily: "'Fraunces', serif", fontSize: '48px', color: '#b3a64f', animation: 'spin 2s linear infinite', marginBottom: '32px', display: 'inline-block' }}>☌</div>
            <div style={{ fontFamily: "'DM Mono', monospace", fontSize: '11px', color: '#6b5d3f', letterSpacing: '0.25em', textTransform: 'uppercase' }}>Die Lesung formt sich</div>
          </div>
        )}

        {stage === 'reading' && reading && (
          <div>
            {VOICES.map(v => (
              <div key={v.key} style={{ borderTop: '1px solid #2a2318', paddingTop: '20px', paddingBottom: '20px' }}>
                <div style={{ display: 'flex', alignItems: 'baseline', gap: '14px', marginBottom: '14px' }}>
                  <span style={{ fontFamily: "'Fraunces', serif", fontSize: '22px', color: '#b3a64f' }}>{v.glyph}</span>
                  <div>
                    <div style={{ fontFamily: "'Fraunces', serif", fontSize: '18px', color: '#e8dcc4', fontStyle: 'italic' }}>{v.name}</div>
                    <div style={{ fontFamily: "'DM Mono', monospace", fontSize: '10px', color: '#6b5d3f', letterSpacing: '0.2em', textTransform: 'uppercase', marginTop: '2px' }}>{v.sub}</div>
                  </div>
                </div>
                {Array.isArray(reading[v.key]) ? (
                  <ol style={{ paddingLeft: 0, listStyle: 'none', margin: 0 }}>
                    {reading[v.key].map((item, i) => (
                      <li key={i} style={{ display: 'flex', gap: '14px', marginBottom: '12px', fontSize: '15px', lineHeight: '1.6', color: '#e8dcc4' }}>
                        <span style={{ fontFamily: "'Fraunces', serif", color: '#b3a64f', fontStyle: 'italic', minWidth: '20px' }}>{['i','ii','iii'][i]}.</span>
                        <span>{item}</span>
                      </li>
                    ))}
                  </ol>
                ) : (
                  <div style={{ fontSize: '15px', lineHeight: '1.7', color: v.key === 'seher' ? '#d4c89a' : '#e8dcc4', fontStyle: v.key === 'seher' ? 'italic' : 'normal', fontFamily: v.key === 'seher' ? "'Fraunces', serif" : "'DM Sans', sans-serif" }}>{reading[v.key]}</div>
                )}
                {v.key === 'sokrates' && (
                  <div style={{ marginTop: '20px', paddingTop: '16px', borderTop: '1px dashed #2a2318' }}>
                    {reading.sokrates.map((q, i) => (
                      <textarea key={i} value={answers[i]} onChange={e => { const n = answers.slice(); n[i] = e.target.value; setAnswers(n); }}
                        placeholder={'Antwort auf Frage ' + (i+1)} disabled={!!revision || revisionLoading}
                        style={{ width: '100%', minHeight: '60px', background: '#0f0a07', border: '1px solid #2a2318', color: '#e8dcc4', padding: '10px', fontFamily: "'DM Sans', sans-serif", fontSize: '13px', boxSizing: 'border-box', marginBottom: '10px', opacity: revision ? 0.5 : 1 }} />
                    ))}
                    {error && !revision && <div style={{ padding: '10px', background: '#2a1515', border: '1px solid #5a2a2a', color: '#d8a8a8', fontSize: '12px', marginBottom: '12px', fontFamily: "'DM Mono', monospace" }}>{error}</div>}
                    {!revision && <button onClick={doRevision} disabled={revisionLoading} style={{ width: '100%', padding: '14px', background: revisionLoading ? '#3a2f1f' : '#2a738a', color: '#e8dcc4', border: 'none', fontFamily: "'Fraunces', serif", fontSize: '14px' }}>{revisionLoading ? 'Revision läuft…' : 'Synthese vertiefen'}</button>}
                  </div>
                )}
              </div>
            ))}
            {revision && (
              <div style={{ marginTop: '20px', padding: '20px', background: '#0f1418', border: '1px solid #2a738a', borderLeft: '3px solid #2a738a' }}>
                <div style={{ fontFamily: "'Fraunces', serif", fontSize: '20px', color: '#7ab5c8', fontStyle: 'italic', marginBottom: '18px' }}>Vertiefung durch deine Antworten</div>
                {[{k:'bestaetigt',l:'Bestätigt'},{k:'korrigiert',l:'Korrigiert'},{k:'neue_erkenntnis',l:'Neue Erkenntnis'},{k:'impuls',l:'Impuls · 7 Tage'}].map(s => (
                  <div key={s.k} style={{ marginBottom: '16px' }}>
                    <div style={{ fontFamily: "'DM Mono', monospace", fontSize: '10px', color: '#6b8d9a', letterSpacing: '0.2em', textTransform: 'uppercase', marginBottom: '6px' }}>{s.l}</div>
                    <div style={{ fontSize: '14px', lineHeight: '1.6', color: '#d4dee2' }}>{revision[s.k]}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Chiromant />);
setTimeout(() => { const l = document.getElementById('loading'); if (l) l.style.display = 'none'; }, 100);
} catch (err) { showError('Crash: ' + (err.message || err)); }
  </script>
</body>
</html>
