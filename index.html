// Robuste JSON-Extraktion und API-Response-Handling.
// Wirft sprechende Fehler, die der User verstehen kann.
async function parseClaudeJsonResponse(res, requiredFields = []) {
const data = await res.json().catch(() => null);

if (!res.ok || !data) {
const apiMsg = data?.error?.message || `HTTP ${res.status}`;
throw new Error(`Die API hat abgelehnt: ${apiMsg}`);
}
if (data.error) {
throw new Error(`Die API meldet: ${data.error.message || 'Unbekannter Fehler'}`);
}
if (!Array.isArray(data.content)) {
throw new Error(‘Die Antwort war leer oder im falschen Format.’);
}

const text = data.content
.filter(c => c.type === ‘text’)
.map(c => c.text)
.join(’’)
.trim();

if (!text) {
throw new Error(‘Der Chiromant hat geschwiegen. Versuch es mit einem klareren Foto.’);
}

// JSON aus dem Text fischen – auch wenn Markdown-Fences oder Erklärtext drumherum.
let jsonStr = text.replace(/`json\s*/gi, '').replace(/`\s*/g, ‘’).trim();
const firstBrace = jsonStr.indexOf(’{’);
const lastBrace = jsonStr.lastIndexOf(’}’);
if (firstBrace === -1 || lastBrace === -1 || lastBrace < firstBrace) {
throw new Error(‘Der Chiromant hat statt JSON einen Erklärtext zurückgegeben. Das passiert meist bei schlechten Bildern.’);
}
jsonStr = jsonStr.slice(firstBrace, lastBrace + 1);

let parsed;
try {
parsed = JSON.parse(jsonStr);
} catch (e) {
throw new Error(‘Das zurückgegebene JSON war defekt. Versuch es nochmal.’);
}

for (const field of requiredFields) {
if (!(field in parsed)) {
throw new Error(`Eine erwartete Stimme fehlt in der Antwort: ${field}. Versuch es nochmal.`);
}
}

return { parsed, rawText: text };
}

// Parses [spezifisch] [probabilistisch] [barnum] tags inline and renders them as pills
function TaggedText({ text }) {
if (!text) return null;
const regex = /[(spezifisch|probabilistisch|barnum)]/gi;
const parts = [];
let lastIdx = 0;
let match;
let key = 0;
while ((match = regex.exec(text)) !== null) {
if (match.index > lastIdx) {
parts.push(<React.Fragment key={key++}>{text.slice(lastIdx, match.index)}</React.Fragment>);
}
const raw = match[1].toLowerCase();
const variant = raw === ‘spezifisch’ ? ‘spec’ : raw === ‘probabilistisch’ ? ‘prob’ : ‘barnum’;
parts.push(<ConfTag key={key++} variant={variant} />);
lastIdx = match.index + match[0].length;
}
if (lastIdx < text.length) {
parts.push(<React.Fragment key={key++}>{text.slice(lastIdx)}</React.Fragment>);
}
return <>{parts}</>;
}

function useLoadingFrame(active) {
const [frame, setFrame] = useState(0);
useEffect(() => {
if (!active) return;
const id = setInterval(() => setFrame(f => f + 1), 50);
return () => clearInterval(id);
}, [active]);
return frame;
}
